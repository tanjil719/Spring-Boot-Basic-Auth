# ============================================================
# SPRING APPLICATION CONFIGURATION
# ============================================================

spring.application.name=basic-auth

# ============================================================
# DATABASE CONFIGURATION (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/basic_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA & HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# HIBERNATE SPECIFIC PROPERTIES
# ============================================================
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# SPRINGDOC OPENAPI (SWAGGER) CONFIGURATION
# ============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ============================================================
# LOGGING CONFIGURATION (Controls console output)
# ============================================================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.engine=WARN