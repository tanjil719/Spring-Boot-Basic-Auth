# ============================================================
# SPRING APPLICATION CONFIGURATION
# ============================================================

spring.application.name=basic-auth

# ============================================================
# DATABASE CONFIGURATION (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/basic_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA & HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# HIBERNATE SPECIFIC PROPERTIES
# ============================================================
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# SPRINGDOC OPENAPI (SWAGGER) CONFIGURATION
# ============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ============================================================
# JWT CONFIGURATION
# ============================================================
token.secret=CG1lfZ93XFLJKtk36mUHZ05Mx0qyqvGfdlctuY3W+cLfSN3XkdBCXhkjiuyR1FQOINfdqGSymErLXK9jHR2igleOumw
token.header-string=Authorization
token.prefix=Bearer
token.expiration-time=86400000

# ============================================================
# LOGGING CONFIGURATION (Controls console output)
# ============================================================
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG